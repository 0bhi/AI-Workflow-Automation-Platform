name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ----------------------------------------------------------------
  # Backend Node — lint, test, build
  # ----------------------------------------------------------------
  backend-node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-node

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend-node/package-lock.json

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  # ----------------------------------------------------------------
  # Agent Python — lint, test
  # ----------------------------------------------------------------
  agent-python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-python

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: pip install ruff && ruff check app/ tests/

      - name: Run tests
        run: pytest -v

  # ----------------------------------------------------------------
  # Frontend — lint, type-check, build
  # ----------------------------------------------------------------
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint || true

      - name: Build
        run: npm run build

  # ----------------------------------------------------------------
  # Docker — verify all Dockerfiles build
  # ----------------------------------------------------------------
  docker-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - { name: backend-node, context: backend-node }
          - { name: agent-python, context: agent-python }
          - { name: frontend, context: frontend }

    steps:
      - uses: actions/checkout@v4

      - name: Build ${{ matrix.service.name }}
        run: docker build -t ${{ matrix.service.name }}:ci ${{ matrix.service.context }}
